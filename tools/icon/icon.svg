<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Reno Master app icon.

    The house of Schlesierstraße 31 from the gable end, with the roof pitch the real
    building has (36 degrees), drawn like a section: the two lines are the floors, so
    the mark shows KG, EG and OG under the roof. It is split along the ridge - left the
    house as it stands, right the renovated one in the app's accent colour.

    No windows and no door on purpose: two openings above a third one read as a face.
    Regenerate the PNGs with: node tools/icon/build-icons.mjs
  -->
  <defs>
    <path id="house"
          d="M 256 131 L 444 268 L 408 268 L 408 410 L 104 410 L 104 268 L 68 268 Z" />
    <clipPath id="left"><rect x="0" y="0" width="256" height="512" /></clipPath>
    <clipPath id="right"><rect x="256" y="0" width="256" height="512" /></clipPath>
  </defs>

  <!-- chimney first: the roof edge cuts it off where it meets the tiles -->
  <rect x="330" y="164" width="38" height="74" fill="#a98a4f" />

  <!-- left: the building as it is -->
  <g clip-path="url(#left)">
    <use href="#house" fill="#4a5765" />
  </g>

  <!-- right: the same house renovated -->
  <g clip-path="url(#right)">
    <use href="#house" fill="#c9a86a" />
  </g>

  <!-- the floors: ground floor, upper floor, roof space -->
  <rect x="104" y="306" width="304" height="9" fill="#1d2126" />
  <rect x="104" y="358" width="304" height="9" fill="#1d2126" />

  <!-- the ridge seam holds the two halves apart at every size -->
  <rect x="252" y="131" width="8" height="279" fill="#1d2126" />
</svg>
