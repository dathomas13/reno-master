name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # die Versionshistorie wird aus den Tags gelesen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no package-lock.json yet: it is generated on the first local install and should
      # be committed afterwards, then this can go back to `npm ci`
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_KEY: ${{ vars.VITE_VAPID_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}
      # a hash router needs no rewrite rules, this is only a safety net
      - run: cp dist/index.html dist/404.html

      # Erst ankündigen, wenn es auch etwas zu installieren gibt.
      #
      # Beide Workflows starten mit demselben Push, aber die Seite steht nach etwa
      # anderthalb Minuten und das APK-Release erst nach dreien. In dieser Lücke meldete
      # version.json die neue Fassung, während releases/latest noch die alte war: das
      # Telefon lud, installierte und startete die Fassung, die es schon hatte - und es
      # sah aus, als hätte das Update funktioniert. Die App zeigt inzwischen selbst an,
      # wenn die Datei noch fehlt; hier wartet zusätzlich die Ankündigung, damit auch
      # ältere Fassungen draußen nicht in die Lücke fallen.
      - name: Auf das APK-Release warten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          for versuch in $(seq 1 24); do
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Release v$version ist da (nach $((versuch * 15)) s)."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Release v$version ist nach sechs Minuten nicht da."
          echo "Die Seite wird trotzdem veröffentlicht - im Web ist das Update vollständig."
          echo "Die App zeigt so lange 'Die App-Datei wird noch gebaut'."

      # the app asks this file whether a newer build exists; the commit is the identity,
      # because the web version and the APK are built from the same one
      - name: version.json schreiben
        # Beides kommt aus derselben Quelle: die Nummer aus package.json, die die App auch
        # im Bundle trägt, und der Text aus RELEASE_NOTES.md - nicht aus der
        # Commit-Nachricht, die für Entwickler geschrieben ist und im Banner auch so klingt.
        run: |
          node --experimental-strip-types tools/release-notes.mjs --current \
            --repo "${{ github.repository }}" \
            > dist/version.json
          cat dist/version.json

          # dazu die ganze Liste, damit die App auch zeigen kann, was in übersprungenen
          # Fassungen steckte
          node --experimental-strip-types tools/release-notes.mjs > dist/versions.json
          node -p "'Versionen in der Historie: ' + require('./dist/versions.json').length"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
