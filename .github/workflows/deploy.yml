name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # die Versionshistorie wird aus den Tags gelesen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no package-lock.json yet: it is generated on the first local install and should
      # be committed afterwards, then this can go back to `npm ci`
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_KEY: ${{ vars.VITE_VAPID_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}
      # a hash router needs no rewrite rules, this is only a safety net
      - run: cp dist/index.html dist/404.html

      # the app asks this file whether a newer build exists; the commit is the identity,
      # because the web version and the APK are built from the same one
      - name: version.json schreiben
        # Beides kommt aus derselben Quelle: die Nummer aus package.json, die die App auch
        # im Bundle trägt, und der Text aus RELEASE_NOTES.md - nicht aus der
        # Commit-Nachricht, die für Entwickler geschrieben ist und im Banner auch so klingt.
        run: |
          node --experimental-strip-types tools/release-notes.mjs --current \
            --apk "https://github.com/${{ github.repository }}/releases/latest/download/reno-master.apk" \
            > dist/version.json
          cat dist/version.json

          # dazu die ganze Liste, damit die App auch zeigen kann, was in übersprungenen
          # Fassungen steckte
          node --experimental-strip-types tools/release-notes.mjs > dist/versions.json
          node -p "'Versionen in der Historie: ' + require('./dist/versions.json').length"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
