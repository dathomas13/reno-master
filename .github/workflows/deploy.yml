name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # die Build-Nummer ist die Anzahl der Commits, dafür braucht es die Historie
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # no package-lock.json yet: it is generated on the first local install and should
      # be committed afterwards, then this can go back to `npm ci`
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_KEY: ${{ vars.VITE_VAPID_KEY }}
      # a hash router needs no rewrite rules, this is only a safety net
      - run: cp dist/index.html dist/404.html

      # the app asks this file whether a newer build exists; the commit is the identity,
      # because the web version and the APK are built from the same one
      - name: version.json schreiben
        # The build number is the commit count, the same number the app bakes into its
        # bundle - a CI run number would count differently in each workflow and the app
        # could not tell newer from older. jq does the quoting, because a commit message
        # brings quotes, backslashes and newlines along.
        run: |
          build=$(git rev-list --count HEAD)
          series=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          jq -n \
            --arg version "$series.$build" \
            --argjson build "$build" \
            --arg sha "$(git rev-parse --short HEAD)" \
            --arg date "$(git log -1 --format=%cs)" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg notes "$(git log -1 --format=%b)" \
            --arg apk "https://github.com/${{ github.repository }}/releases/latest/download/reno-master.apk" \
            '{version: $version, build: $build, sha: $sha, date: $date, subject: $subject, notes: $notes, apk: $apk}' \
            > dist/version.json
          cat dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
