name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no package-lock.json yet: it is generated on the first local install and should
      # be committed afterwards, then this can go back to `npm ci`
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # the generated model files must match the data base they come from
      - run: python3 tools/model/build_rooms.py
      - run: python3 tools/model/build_plans_svg.py
      - run: python3 tools/model/make_manifest.py
      - run: git diff --exit-code public/models public/plans
