name: Android APK

# The Android project is generated on the runner instead of being committed: Capacitor
# regenerates it from capacitor.config.ts and the installed plugins, so it always matches
# the dependency versions. Commit android/ later if a native file needs editing by hand -
# the workflow then skips the generation step and only syncs.
on:
  workflow_dispatch:
  push:

# the release is updated from here
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Verlauf und Tags, damit die Prüfung unten erkennen kann, ob diese
        # Fassung schon veröffentlicht wurde
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version muss angehoben sein
        # Die Versionsnummer wird von Hand gepflegt, und genau deshalb kann man sie
        # vergessen. Dann bekäme niemand das Update angeboten - also lieber hier
        # scheitern als still danebenliegen. Verglichen wird mit der zuletzt
        # veröffentlichten Fassung; ein erneut gestarteter Lauf darf dieselbe behalten.
        #
        # Ein Merge nach main bringt eine Fassung mit, die vom Zweig aus schon
        # veröffentlicht wurde. Da ist nichts vergessen worden und auch nichts Neues
        # zu veröffentlichen: erkennbar daran, dass der Tag dieser Fassung bereits
        # existiert und in dieser Historie steckt. Dann wird gebaut, aber kein Release
        # angelegt - vorher ist main nach jedem Merge rot geworden.
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code_of() {
            node --experimental-strip-types -e "
              import { versionCode } from './src/lib/version.ts';
              process.stdout.write(String(versionCode(process.argv[1])));
            " "$1"
          }
          version=$(node -p "require('./package.json').version")
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          latest=${latest#v}
          echo "diese Fassung: $version, zuletzt veröffentlicht: ${latest:-keine}"

          # von Hand gestartet oder noch einmal gestartet: die Nummer darf bleiben, und
          # veröffentlicht wird trotzdem - sonst ließe sich ein abgebrochener Upload
          # nicht nachholen
          erneut=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.run_attempt }}" != "1" ]; then
            erneut=true
          fi

          if [ "$erneut" = "false" ] \
             && git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
             && git merge-base --is-ancestor "refs/tags/v$version" HEAD; then
            echo "v$version ist schon veröffentlicht und steckt in dieser Historie."
            echo "Es wird gebaut, aber kein Release angelegt."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$erneut" = "true" ]; then
            exit 0
          fi

          if [ -n "$latest" ] && [ "$(code_of "$version")" -le "$(code_of "$latest")" ]; then
            echo "Die Version in package.json ist nicht höher als die veröffentlichte."
            echo "Bitte erhöhen - Fehlerbehebung: letzte Stelle, neue Funktion: mittlere."
            exit 1
          fi

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Web-Build für die App (base = /)
        run: npm run build:app
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_KEY: ${{ vars.VITE_VAPID_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}

      - name: Android-Projekt anlegen, falls es noch keines gibt
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Web-Assets und Plugins übernehmen
        run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        id: signing
        # Ohne festen Schlüssel signiert jeder Lauf anders und Android lehnt die
        # Installation über die alte Fassung ab. Liegt das Secret vor, wird ab hier mit
        # dem Release-Schlüssel gebaut; fehlt es, kommt der feste Debug-Schlüssel aus dem
        # Repo zum Zug - Androids eigene Standardwerte, nicht geheim, aber immer derselbe,
        # statt dass jeder Runner sich einen neuen Wegwerf-Schlüssel erzeugt. Ohne das
        # verweigert Android jede Aktualisierung von einem Debug-Build auf einen anderen,
        # auch zwischen zwei Branches.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            cp tools/android/debug.keystore ~/.android/debug.keystore
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Kein ANDROID_KEYSTORE_BASE64 hinterlegt - fester Debug-Schlüssel aus dem Repo."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64 ist gesetzt, ANDROID_KEYSTORE_PASSWORD fehlt." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          cat > android/keystore.properties <<PROPS
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-reno}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release-Schlüssel eingerichtet."

      - name: Berechtigungen, Version und Signatur eintragen
        # Dieselbe Nummer wie im Web-Bundle und in version.json: die Anzahl der Commits.
        # Android nimmt eine neue APK nur an, wenn versionCode nicht kleiner wird.
        run: |
          version=$(node -p "require('./package.json').version")
          code=$(node --experimental-strip-types -e "
            import { versionCode } from './src/lib/version.ts';
            process.stdout.write(String(versionCode(process.argv[1])));
          " "$version")
          echo "Version $version (Code $code)"
          RENO_VERSION_CODE="$code" RENO_VERSION_NAME="$version" \
            node tools/android/patch-android.mjs

      - name: Prüfen, dass die Anpassungen wirklich drinstehen
        run: |
          set -e
          manifest=android/app/src/main/AndroidManifest.xml
          for permission in CAMERA POST_NOTIFICATIONS READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$permission" "$manifest" \
              || { echo "Berechtigung fehlt im Manifest: $permission"; exit 1; }
          done
          grep -q ">Reno Master<" android/app/src/main/res/values/strings.xml \
            || { echo "App-Name wurde nicht gesetzt"; exit 1; }
          test -f android/app/src/main/assets/public/index.html \
            || { echo "Web-Assets fehlen im Projekt"; exit 1; }
          # Ohne dieses Symbol verwirft Android jede Benachrichtigung kommentarlos.
          test -f android/app/src/main/res/drawable/ic_stat_reno.xml \
            || { echo "Das Symbol für Benachrichtigungen fehlt"; exit 1; }
          grep -q "ic_stat_reno" android/app/src/main/assets/capacitor.config.json \
            || { echo "smallIcon zeigt nicht auf ic_stat_reno"; exit 1; }
          for plugin in reno-mediastore reno-appupdate reno-fileexport capacitor-local-notifications; do
            grep -q "$plugin" android/capacitor.settings.gradle \
              || { echo "Plugin nicht eingebunden: $plugin"; exit 1; }
          done
          grep -q "versionName \"$(node -p "require('./package.json').version")\"" android/app/build.gradle \
            || { echo "Die Versionsnummer wurde nicht gesetzt"; exit 1; }
          grep -q "signingConfigs" android/app/build.gradle \
            || { echo "Der Signatur-Block fehlt in app/build.gradle"; exit 1; }
          cmp -s tools/icon/android/ic_launcher-xxxhdpi.png \
                 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "Das App-Icon wurde nicht übernommen"; exit 1; }
          echo "Manifest, App-Name, Web-Assets, Plugins und Version sind in Ordnung."

      - name: APK bauen
        working-directory: android
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: APK einsammeln und Signatur prüfen
        run: |
          set -e
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            built=android/app/build/outputs/apk/release/app-release.apk
          else
            built=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$built" || { echo "APK nicht gefunden: $built"; exit 1; }
          # immer derselbe Dateiname, damit der Link in der App stabil bleibt
          cp "$built" reno-master.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs reno-master.apk | head -4
          fi
          ls -lh reno-master.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: reno-master-apk
          path: reno-master.apk
          if-no-files-found: error
          retention-days: 30

      # a release gives the APK a permanent address that works without a GitHub login,
      # which is what the update banner in the app links to
      - name: Release veröffentlichen
        if: ${{ steps.version.outputs.publish != 'false' }}
        # Aus jedem Branch, bewusst: das Telefon aktualisiert sich über releases/latest
        # selbst, und jeder Entwicklungsschritt soll dort ankommen, ohne vorher gemergt
        # zu werden. Dass die Nummer damit verbraucht ist, ist kein Problem - sie wird je
        # Schritt sowieso angehoben, und genau daran erinnert die Prüfung oben.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            hinweis="Signiert mit dem festen Release-Schlüssel: diese Fassung installiert sich über die vorige."
          else
            hinweis="Debug-Build mit dem festen Debug-Schlüssel aus dem Repo: löst jeden anderen Debug-Build dieses Projekts ab, auch von einem anderen Branch. Nur der einmalige Wechsel auf den echten Release-Schlüssel bricht die Kette - dann einmal die alte App deinstallieren."
          fi
          # ein erneut gestarteter Lauf trägt dieselbe Nummer, der Tag ist dann schon da:
          # in dem Fall nur die Datei ersetzen, statt am vorhandenen Release zu scheitern
          #
          # --target auf den gebauten Commit: ohne das setzt gh den Tag auf den Kopf des
          # Default-Branch. Läuft der Workflow von einem Feature-Branch, hängt der Tag
          # dann an Code, der die APK gar nicht enthält - v0.20.0 ist genau so entstanden.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" reno-master.apk --clobber
          else
            # derselbe Text wie im Update-Banner der App, aus RELEASE_NOTES.md
            notizen=$(node --experimental-strip-types tools/release-notes.mjs --text)
            gh release create "$tag" \
              reno-master.apk \
              --target "$GITHUB_SHA" \
              --title "Reno Master $version ($(git log -1 --format=%cs))" \
              --notes "$notizen

          $hinweis" \
              --latest
          fi
